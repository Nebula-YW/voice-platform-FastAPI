[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-platform-api"
version = "0.1.0"
description = "A comprehensive voice processing platform with TTS and language detection services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.3",
    "edge-tts>=7.2.8",
    "lingua-language-detector>=2.2.0",
    "mcp>=2.2.0",
    "uvicorn>=0.53.0",
]

[tool.setuptools]
packages = ["api"]

[tool.ruff.lint]
# Existing HTTP wrappers catch Exception to return 500; keep that contract.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark the test as an asyncio coroutine"
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "pre-commit>=4.6.2",
]
